<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Emlakçı Otomasyonu</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Emlakçı Otomasyonu</h1>
        <p>SQL Server bağlantılı basit yönetim ekranı</p>
      </div>
      <div id="connectionStatus" class="status">Bağlantı kontrol ediliyor</div>
    </header>

    <main class="layout">
      <nav class="tabs" aria-label="Sayfalar">
        <button class="tab active" data-page="dashboard">Özet</button>
        <button class="tab" data-page="musteriler">Müşteriler</button>
        <button class="tab" data-page="calisanlar">Çalışanlar</button>
        <button class="tab" data-page="ilanlar">İlanlar</button>
      </nav>

      <section id="dashboard" class="page active">
        <div class="sectionHeader">
          <h2>Genel Özet</h2>
          <button id="refreshDashboard" class="secondary">Yenile</button>
        </div>
        <div class="summaryGrid">
          <div class="metric">
            <span>Müşteri</span>
            <strong id="musteriCount">0</strong>
          </div>
          <div class="metric">
            <span>Çalışan</span>
            <strong id="calisanCount">0</strong>
          </div>
          <div class="metric">
            <span>İlan</span>
            <strong id="ilanCount">0</strong>
          </div>
        </div>
        <h3>Komisyon Özeti</h3>
        <div id="komisyonOzeti" class="tableWrap"></div>
      </section>

      <section id="musteriler" class="page">
        <div class="sectionHeader">
          <h2>Müşteriler</h2>
          <button data-refresh="musteriler" class="secondary">Yenile</button>
        </div>
        <form id="musteriForm" class="formGrid">
          <label>Ad <input name="ad" required></label>
          <label>Soyad <input name="soyad" required></label>
          <label>TC Kimlik No <input name="tc_kimlik_no" maxlength="11"></label>
          <label>Telefon <input name="telefon" maxlength="11" required></label>
          <fieldset class="wide">
            <legend>Müşteri Tipleri</legend>
            <div id="musteriTipleri" class="checks"></div>
          </fieldset>
          <button type="submit">Müşteri Ekle</button>
        </form>
        <div id="musterilerTable" class="tableWrap"></div>
      </section>

      <section id="calisanlar" class="page">
        <div class="sectionHeader">
          <h2>Çalışanlar</h2>
          <button data-refresh="calisanlar" class="secondary">Yenile</button>
        </div>
        <form id="calisanForm" class="formGrid">
          <label>Ad <input name="ad" required></label>
          <label>Soyad <input name="soyad" required></label>
          <label>Telefon <input name="telefon" maxlength="11" required></label>
          <label>Personel Tipi <select name="personel_tipi_id" required></select></label>
          <label>İşe Başlama <input type="date" name="ise_baslama_tarihi" required></label>
          <button type="submit">Çalışan Ekle</button>
        </form>
        <div id="calisanlarTable" class="tableWrap"></div>
      </section>

      <section id="ilanlar" class="page">
        <div class="sectionHeader">
          <h2>İlanlar</h2>
          <button data-refresh="ilanlar" class="secondary">Yenile</button>
        </div>
        <form id="ilanForm" class="formGrid">
          <label>Başlık <input name="baslik" required></label>
          <label>Fiyat <input type="number" name="fiyat" min="1" required></label>
          <label>İlan Tipi <select name="ilan_tipi_id" required></select></label>
          <label>Emlak Tipi <select name="emlak_tipi_id" required></select></label>
          <label>Oda Tipi <select name="oda_tipi_id" required></select></label>
          <label>Isıtma Tipi <select name="isitma_tipi_id" required></select></label>
          <label>Müşteri <select name="musteri_id" required></select></label>
          <label>Çalışan <select name="calisan_id" required></select></label>
          <label>İl <input name="il" required></label>
          <label>İlçe <input name="ilce" required></label>
          <label>Mahalle <input name="mahalle"></label>
          <label>Adres <input name="adres"></label>
          <label>Yapım Yılı <input type="number" name="yapim_yili" min="1801" required></label>
          <label>Metrekare <input type="number" name="metrekare" min="1" required></label>
          <label>Bulunduğu Kat <input type="number" name="bulundugu_kat"></label>
          <label>Toplam Kat <input type="number" name="toplam_kat" min="1"></label>
          <label>Balkon Sayısı <input type="number" name="balkon_sayisi" min="0"></label>
          <label>WC Sayısı <input type="number" name="wc_sayisi" min="1"></label>
          <label class="kiralikOnly">Aidat <input type="number" name="aidat_tutari" min="0"></label>
          <label class="kiralikOnly">Depozito <input type="number" name="depozito_tutari" min="0"></label>
          <label class="kiralikOnly inlineCheck"><input type="checkbox" name="esyali_mi"> Eşyalı</label>
          <label class="satilikOnly">Tapu Durumu <select name="tapu_durumu_id"></select></label>
          <label class="satilikOnly inlineCheck"><input type="checkbox" name="krediye_uygun_mu"> Krediye Uygun</label>
          <button type="submit">İlan Ekle</button>
        </form>
        <div id="ilanlarTable" class="tableWrap"></div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
